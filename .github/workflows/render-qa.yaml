name: QA Procedure HTML Build

on:
  push:
    branches: [ Add-QA ] # Enables isolated testing on Add-QA
  workflow_dispatch: # Allows manual run if needed

jobs:
  build-qa-html:
    name: Build QA HTML File
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Convert QA.md to HTML
        run: |
          pandoc documentation/QA.md \
            --standalone \
            --embed-resources \
            -c "https://cdn.jsdelivr.net/npm/@exampledev/new.css@1.1.2/new.min.css" \
            -o documentation/QA.html

      - name: Upload HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: QA-Document-HTML
          path: documentation/QA.html
